plugins {
	id 'net.minecraftforge.gradle' version '6.+'
	id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = uri("https://api.modrinth.com/maven")
			}
		}
		filter {
			includeGroup("maven.modrinth")
		}
	}
}

dependencies {
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_current_version}"
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
	implementation jarJar("io.github.llamalad7:mixinextras-forge:0.4.1") { jarJar.ranged(it, "[0.4.1,)") }
	compileOnly project(":common")
	implementation "maven.modrinth:not-enough-animations:${project.not_enough_animations_modrinth_forge_id}"
	implementation "maven.modrinth:first-person-model:${project.first_person_model_forge_id}"
}

base {
	archivesName = "crawl"
}

mixin {
	config("crawl.client.mixins.json")
	config("crawl.compat.fpm.mixins.json")
	config("crawl.compat.nea.mixins.json")
	config("crawl.mixins.json")
}
jar {
	manifest {
		attributes["MixinConfigs"] = "crawl.client.mixins.json,crawl.compat.fpm.mixins.json,crawl.compat.nea.mixins.json,crawl.mixins.json"
	}
}

minecraft {
	mappings channel: 'official', version: minecraft_version
	reobf = false

	accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

	runs {
		client {
			workingDirectory new File(project.rootDir, "/run")
			taskName 'runClient'
			mods {
				modClientRun {
					source sourceSets.main
				}
			}
		}

		server {
			workingDirectory new File(project.rootDir, "/run")
			taskName 'runServer'
			mods {
				modServerRun {
					source sourceSets.main
				}
			}
		}
	}
}

processResources {
	from project(":common").sourceSets.main.resources

	var expandProps = [
		'version'                      : version,
		'minecraft_version'            : minecraft_version,
		'mod_name'                     : mod_name,
		'mod_author'                   : mod_author,
		'license'                      : license,
		'description'                  : project.description,
		'forge_minimum_version'        : forge_minimum_version,
		'forge_loader_version_range'   : forge_loader_version_range,
		'forge_minecraft_version_range': forge_minecraft_version_range,
		'credits'                      : credits,
	]

	filesMatching(['META-INF/mods.toml']) {
		expand expandProps
	}

	inputs.properties(expandProps)
}


compileJava.source project(":common").sourceSets.main.allSource

sourceSets.each {
	def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
	it.output.resourcesDir = dir
	it.java.destinationDirectory = dir
}